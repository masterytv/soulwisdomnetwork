<!doctype html>
<!-- The full-screen pull quote (docs/specs/021-motion-graphics.md, item M2), rebuilt from the design
     reference (docs/specs/021-motion-graphics/Quote.dc.html): the big quotation mark drops in, the quote
     builds line by line in EB Garamond italic (the last line in pale gold), a rule draws and the
     attribution fades up; the starry sky drifts slowly the whole time. Same markup, colours, type and
     keyframes, the review loop replaced by in / hold / out (runtime.js). Fields: quote (split into up to
     three balanced lines here), speaker (the attribution line; hidden when empty).
     Full screen: the sky is painted. Fonts come from local files only. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pull quote</title>
<style>
@font-face { font-family: 'Outfit'; src: url('fonts/Outfit-latin.woff2') format('woff2'); font-weight: 100 900; font-display: block; }
@font-face { font-family: 'EB Garamond'; src: url('fonts/EBGaramond-Italic-latin.woff2') format('woff2'); font-weight: 400 800; font-style: italic; font-display: block; }
html, body { margin: 0; background: transparent; }
.root { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: 'Outfit', system-ui, sans-serif; color: #fff;
        --gold: #f7c65b; --pale: #fde68a; }
.sky { position: absolute; inset: -60px; background-color: var(--ink);
       background-image:
           radial-gradient(2px 2px at 9% 16%, rgba(255,255,255,.7), transparent), radial-gradient(1.5px 1.5px at 27% 83%, rgba(255,255,255,.5), transparent),
           radial-gradient(2px 2px at 58% 10%, rgba(255,255,255,.6), transparent), radial-gradient(1.5px 1.5px at 76% 79%, rgba(255,255,255,.5), transparent),
           radial-gradient(2px 2px at 92% 24%, rgba(255,255,255,.7), transparent),
           radial-gradient(ellipse 80% 70% at 30% 40%, var(--glow-a) 0%, var(--glow-b) 45%, var(--deep) 100%); }
.ring1 { position: absolute; right: -260px; top: 120px; width: 900px; height: 900px; border-radius: 50%; border: 1px solid var(--gold-18); }
.ring2 { position: absolute; right: -160px; top: 220px; width: 700px; height: 700px; border-radius: 50%; border: 1px solid var(--gold-12); }
.col { position: absolute; left: 200px; top: 230px; width: 1400px; display: flex; flex-direction: column; }
.mark { display: block; height: 170px; font-family: 'EB Garamond', serif; font-style: italic; font-weight: 500; font-size: 340px; line-height: 0.9; color: var(--gold); }
blockquote { margin: 0; display: flex; flex-direction: column; gap: 6px; }
.line { display: block; font-family: 'EB Garamond', serif; font-style: italic; font-weight: 400; line-height: 1.12; color: #ffffff; }
.line.pale { color: var(--pale); }
.rule { margin-top: 56px; width: 220px; height: 2px; transform-origin: left center; background: var(--gold); }
.who { margin: 26px 0 0 0; font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 24px; letter-spacing: 0.28em; text-transform: uppercase; color: #cdbfff; }
</style>
</head>
<body>
<div id="g" class="root">
  <div id="sky" class="sky" aria-hidden="true"></div>
  <div class="ring1" aria-hidden="true"></div>
  <div class="ring2" aria-hidden="true"></div>
  <div class="col">
    <span id="mark" class="mark" aria-hidden="true">“</span>
    <blockquote id="quote"></blockquote>
    <div id="rule" class="rule" aria-hidden="true"></div>
    <p id="who" class="who"></p>
  </div>
</div>
<script src="runtime.js"></script>
<script>
(() => {
    'use strict';
    const g = window.GRAPHIC || {};
    const f = g.fields || {};
    const colors = g.colors || {};
    const el = id => document.getElementById(id);
    const hex = c => /^#[0-9a-fA-F]{6}$/.test(c || '');
    const rgb = c => { const n = parseInt(c.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
    const toHex = v => `#${v.map(x => Math.round(Math.min(255, Math.max(0, x))).toString(16).padStart(2, '0')).join('')}`;
    const lighten = (c, amount) => toHex(rgb(c).map(x => x + amount * 255));
    const darken = (c, by) => toHex(rgb(c).map(x => x * by));

    const root = el('g');
    const ink = hex(colors.background) ? colors.background : '#140a2e';
    const gold = hex(colors.accent) ? colors.accent : '#f7c65b';
    const [glowA, glowB] = ink === '#140a2e' ? ['#2f1c6b', '#1c0f45'] : [lighten(ink, 0.25), lighten(ink, 0.08)];
    root.style.setProperty('--ink', ink);
    root.style.setProperty('--deep', ink === '#140a2e' ? '#120828' : darken(ink, 0.55));
    root.style.setProperty('--glow-a', glowA);
    root.style.setProperty('--glow-b', glowB);
    root.style.setProperty('--gold', gold);
    root.style.setProperty('--pale', gold === '#f7c65b' ? '#fde68a' : lighten(gold, 0.25));
    root.style.setProperty('--gold-18', `rgba(${rgb(gold).join(',')},0.18)`);
    root.style.setProperty('--gold-12', `rgba(${rgb(gold).join(',')},0.12)`);

    // The quote, split into up to three balanced lines (whole words, evened by characters); the last
    // line in pale gold, as the design's highlighted second line. Long quotes shrink to fit the width.
    const words = (f.quote || '').trim().split(/\s+/).filter(Boolean);
    const chars = words.join(' ').length;
    const count = chars > 56 ? 3 : chars > 26 ? 2 : 1;
    const lines = [];
    let i = 0;
    for (let line = 0; line < count; line++) {
        const left = words.length - i, linesLeft = count - line;
        let take = Math.max(1, Math.round(left / linesLeft));
        // Even by characters: move the break while it balances better.
        while (take < left - (linesLeft - 1) && words.slice(i, i + take).join(' ').length < chars / count) take++;
        lines.push(words.slice(i, i + take).join(' '));
        i += take;
        if (i >= words.length) break;
    }
    const longest = Math.max(...lines.map(l => l.length), 1);
    const size = Math.max(56, Math.min(104, Math.floor(104 * 26 / longest)));
    const quote = el('quote');
    const lineEls = lines.map((text, k) => {
        const span = document.createElement('span');
        span.className = `line${k === lines.length - 1 && lines.length > 1 ? ' pale' : ''}`;
        span.style.fontSize = `${size}px`;
        span.textContent = text;
        quote.appendChild(span);
        return span;
    });
    el('who').textContent = f.speaker || '';
    if (!f.speaker) el('who').style.display = 'none';

    // The design's 9 s cycle as in / hold / out: the mark drops in, each line rises out of a blur
    // ~700 ms after the one before, the rule draws, the attribution fades; the sky drifts throughout.
    const R = window.graphicRuntime;
    const T = R.total();
    R.animate(el('sky'), { inMs: Math.max(1, T - 1), outMs: 0, enter: [
        { at: 0, transform: 'translate(0px, 0px)', easing: 'ease-in-out' },
        { at: 0.5, transform: 'translate(-40px, 20px)', easing: 'ease-in-out' },
        { at: 1, transform: 'translate(0px, 0px)' },
    ], exit: [] });
    R.animate(el('mark'), { inMs: 900, outMs: 500, enter: [
        { at: 0, opacity: 0, transform: 'translateY(-30px) scale(1.2)' }, { at: 1, opacity: 1, transform: 'translateY(0) scale(1)' },
    ], exit: [{ at: 1, opacity: 0, transform: 'translateY(0) scale(1)' }] });
    lineEls.forEach((span, k) => R.animate(span, { delay: 350 + k * 700, inMs: 1080, outMs: 500, enter: [
        { at: 0, opacity: 0, transform: 'translateY(34px)', filter: 'blur(12px)' },
        { at: 1, opacity: 1, transform: 'translateY(0)', filter: 'blur(0px)' },
    ], exit: [{ at: 1, opacity: 0, transform: 'translateY(-8px)', filter: 'blur(6px)' }] }));
    R.animate(el('rule'), { delay: 350 + lineEls.length * 700 + 150, inMs: 900, outMs: 500, enter: [
        { at: 0, opacity: 1, transform: 'scaleX(0)' }, { at: 1, opacity: 1, transform: 'scaleX(1)' },
    ], exit: [{ at: 1, opacity: 0, transform: 'scaleX(1)' }] });
    if (f.speaker) R.animate(el('who'), { delay: 350 + lineEls.length * 700 + 400, inMs: 900, outMs: 500, enter: [
        { at: 0, opacity: 0 }, { at: 1, opacity: 1 },
    ], exit: [{ at: 1, opacity: 0 }] });

    window.seek(0);
})();
</script>
</body>
</html>
