<!doctype html>
<!-- Highlight, split with the quote beside (docs/specs/021-motion-graphics.md, item M3), rebuilt from the
     design reference (docs/specs/021-motion-graphics/HighlightSplit.dc.html): the episode's picture slides
     left into a rounded, gold-framed window (left 110, top 140, 860 × 800) while the quote builds line by
     line on the right, the last line pale gold, the speaker's name under it. Same markup, colours, type and
     keyframes; the review loop replaced by in / hold / out (runtime.js). The picture's own move is declared
     as window.GRAPHIC_LAYOUT (a pan, never a crop: scale 1, x −410) and drawn by the render; this file
     draws the three planes GRAPHIC.mode names — 'graphics' (quote, frame line), 'matte' (where the picture
     shows, as alpha) and 'background' (the starry sky). Fields: words, emphasis (unused here), speaker.
     Fonts from local files only. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Highlight: split, quote beside</title>
<style>
@font-face { font-family: 'Outfit'; src: url('fonts/Outfit-latin.woff2') format('woff2'); font-weight: 100 900; font-display: block; }
@font-face { font-family: 'EB Garamond'; src: url('fonts/EBGaramond-Italic-latin.woff2') format('woff2'); font-weight: 400 800; font-style: italic; font-display: block; }
html, body { margin: 0; background: transparent; }
.root { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: 'Outfit', system-ui, sans-serif; color: #fff;
        --gold: #f7c65b; --pale: #fde68a; }
.sky { position: absolute; inset: 0; background-color: var(--ink);
       background-image:
           radial-gradient(2px 2px at 62% 14%, rgba(255,255,255,.7), transparent), radial-gradient(1.5px 1.5px at 78% 82%, rgba(255,255,255,.5), transparent),
           radial-gradient(2px 2px at 93% 30%, rgba(255,255,255,.7), transparent), radial-gradient(1.5px 1.5px at 55% 92%, rgba(255,255,255,.5), transparent),
           radial-gradient(ellipse 55% 70% at 74% 45%, var(--glow-a) 0%, var(--glow-b) 40%, var(--ink) 75%, var(--deep) 100%); }
.matte { position: absolute; inset: 0; background: #fff; }
.frame { position: absolute; left: 110px; top: 140px; width: 860px; height: 800px; box-sizing: border-box; border-radius: 20px;
         border: 2px solid var(--gold-80); box-shadow: 0 30px 80px rgba(0,0,0,0.45); }
.col { position: absolute; left: 1070px; top: 250px; width: 740px; display: flex; flex-direction: column; gap: 10px; }
.mark { display: block; height: 120px; font-family: 'EB Garamond', serif; font-style: italic; font-weight: 500; font-size: 240px; line-height: 0.9; color: var(--gold); }
blockquote { margin: 0; display: flex; flex-direction: column; gap: 4px; }
.line { display: block; font-family: 'EB Garamond', serif; font-style: italic; font-weight: 400; line-height: 1.14; color: #ffffff; }
.line.pale { color: var(--pale); }
.who { margin-top: 34px; display: flex; align-items: center; gap: 14px; }
.who p { margin: 0; font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 24px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold); }
.who path { fill: var(--gold); }
</style>
</head>
<body>
<div id="g" class="root">
  <div id="sky" class="sky" aria-hidden="true"></div>
  <div id="matte" class="matte" aria-hidden="true"></div>
  <div id="art">
    <div id="frame" class="frame" aria-hidden="true"></div>
    <div class="col">
      <span id="mark" class="mark" aria-hidden="true">“</span>
      <blockquote id="quote"></blockquote>
      <div id="who" class="who">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24"><path d="M12 0C12.9 8 16 11.1 24 12C16 12.9 12.9 16 12 24C11.1 16 8 12.9 0 12C8 11.1 11.1 8 12 0Z"></path></svg>
        <p id="whoName"></p>
      </div>
    </div>
  </div>
</div>
<script src="runtime.js"></script>
<script>
(() => {
    'use strict';
    // The picture's move while this highlight is up (lib/reframe.ts Box, 1920 × 1080 px, scale about the
    // top left): the design pans it 410 px left into the window; the matte below does all the shaping.
    window.GRAPHIC_LAYOUT = {
        from: { x: 0, y: 0, scale: 1, brightness: 1, blur: 0 },
        to: { x: -410, y: 0, scale: 1, brightness: 1, blur: 0 },
        inMs: 700, outMs: 700,
    };

    const g = window.GRAPHIC || {};
    const f = g.fields || {};
    const colors = g.colors || {};
    const mode = g.mode || 'graphics';
    const el = id => document.getElementById(id);
    const hex = c => /^#[0-9a-fA-F]{6}$/.test(c || '');
    const rgb = c => { const n = parseInt(c.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
    const toHex = v => `#${v.map(x => Math.round(Math.min(255, Math.max(0, x))).toString(16).padStart(2, '0')).join('')}`;
    const lighten = (c, amount) => toHex(rgb(c).map(x => x + amount * 255));
    const darken = (c, by) => toHex(rgb(c).map(x => x * by));

    const root = el('g');
    const ink = hex(colors.background) ? colors.background : '#140a2e';
    const gold = hex(colors.accent) ? colors.accent : '#f7c65b';
    const [glowA, glowB] = ink === '#140a2e' ? ['#3b2382', '#23145a'] : [lighten(ink, 0.25), lighten(ink, 0.08)];
    root.style.setProperty('--ink', ink);
    root.style.setProperty('--deep', ink === '#140a2e' ? '#0b0520' : darken(ink, 0.55));
    root.style.setProperty('--glow-a', glowA);
    root.style.setProperty('--glow-b', glowB);
    root.style.setProperty('--gold', gold);
    root.style.setProperty('--pale', gold === '#f7c65b' ? '#fde68a' : lighten(gold, 0.25));
    root.style.setProperty('--gold-80', `rgba(${rgb(gold).join(',')},0.8)`);

    // One plane per clip (GRAPHIC.mode): the sky behind the picture, the matte it shows through, or the
    // quote and frame line over it.
    el('sky').style.display = mode === 'background' ? '' : 'none';
    el('matte').style.display = mode === 'matte' ? '' : 'none';
    el('art').style.display = mode === 'graphics' ? '' : 'none';

    const R = window.graphicRuntime;
    const PE = R.PICTURE_EASE;

    // The matte: full frame while the picture is, the design's rounded window through the hold, moving
    // with the picture's own curve so the render's alphamerge never drifts from GRAPHIC_LAYOUT.
    const FULL = 'inset(0px 0px 0px 0px round 0px)';
    const WINDOW = 'inset(140px 950px 140px 110px round 20px)';
    if (mode === 'matte') {
        R.animate(el('matte'), { inMs: 700, outMs: 700, enter: [
            { at: 0, clipPath: FULL, easing: PE }, { at: 1, clipPath: WINDOW, easing: PE },
        ], exit: [{ at: 1, clipPath: FULL }] });
    }

    if (mode === 'graphics') {
        // The quote, split into up to three balanced lines (whole words, evened by characters), the last
        // line pale gold as the design's; long quotes shrink to fit the 740 px column.
        const words = (f.words || 'No one has to prove what happened to them.').trim().split(/\s+/).filter(Boolean);
        const chars = words.join(' ').length;
        const count = chars > 42 ? 3 : chars > 20 ? 2 : 1;
        const lines = [];
        let i = 0;
        for (let line = 0; line < count; line++) {
            const left = words.length - i, linesLeft = count - line;
            let take = Math.max(1, Math.round(left / linesLeft));
            while (take < left - (linesLeft - 1) && words.slice(i, i + take).join(' ').length < chars / count) take++;
            lines.push(words.slice(i, i + take).join(' '));
            i += take;
            if (i >= words.length) break;
        }
        const longest = Math.max(...lines.map(l => l.length), 1);
        const size = Math.max(44, Math.min(72, Math.floor(72 * 19 / longest)));
        const quote = el('quote');
        const lineEls = lines.map((text, k) => {
            const span = document.createElement('span');
            span.className = `line${k === lines.length - 1 && lines.length > 1 ? ' pale' : ''}`;
            span.style.fontSize = `${size}px`;
            span.textContent = text;
            quote.appendChild(span);
            return span;
        });
        el('whoName').textContent = f.speaker || '';
        if (!f.speaker) el('who').style.display = 'none';

        // The design's cycle as in / hold / out: the frame line settles as the picture does, the mark and
        // each line rise out of a blur in turn, the name last; everything eases away together.
        R.animate(el('frame'), { delay: 150, inMs: 700, outMs: 500, enter: [
            { at: 0, opacity: 0, transform: 'scale(1.04)', easing: PE }, { at: 1, opacity: 1, transform: 'scale(1)' },
        ], exit: [{ at: 1, opacity: 0, transform: 'scale(1)' }] });
        R.animate(el('mark'), { delay: 150, inMs: 900, outMs: 500, enter: [
            { at: 0, opacity: 0, transform: 'translateY(30px)', filter: 'blur(10px)' },
            { at: 1, opacity: 1, transform: 'translateY(0)', filter: 'blur(0px)' },
        ], exit: [{ at: 1, opacity: 0, transform: 'translateY(-8px)', filter: 'blur(6px)' }] });
        lineEls.forEach((span, k) => R.animate(span, { delay: 300 + k * 200, inMs: 900, outMs: 500, enter: [
            { at: 0, opacity: 0, transform: 'translateY(30px)', filter: 'blur(10px)' },
            { at: 1, opacity: 1, transform: 'translateY(0)', filter: 'blur(0px)' },
        ], exit: [{ at: 1, opacity: 0, transform: 'translateY(-8px)', filter: 'blur(6px)' }] }));
        if (f.speaker) R.animate(el('who'), { delay: 700, inMs: 900, outMs: 500, enter: [
            { at: 0, opacity: 0, transform: 'translateY(20px)' }, { at: 1, opacity: 1, transform: 'translateY(0)' },
        ], exit: [{ at: 1, opacity: 0, transform: 'translateY(0)' }] });
    }

    window.seek(0);
})();
</script>
</body>
</html>
