<!doctype html>
<!-- The chapter divider (docs/specs/021-motion-graphics.md, item M2) as a banner over the bottom third of the
     picture (Tom's call after the first episode: a full-screen slide at every chapter stopped the
     conversation). The look of the design reference (docs/specs/021-motion-graphics/Chapter.dc.html)
     carried down to a band: the night ink rising from the frame's foot, the outlined roman numeral sliding
     in as its letter-spacing settles, "CHAPTER TWO" and the title rising, the gold rule drawing out, with
     in / hold / out timing (runtime.js). Fields: number ("2" becomes II and TWO, 1-12; else the digits),
     title. Transparent above the band, so the episode shows through. Fonts come from local files only. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chapter banner</title>
<style>
@font-face { font-family: 'Cinzel'; src: url('fonts/Cinzel-latin.woff2') format('woff2'); font-weight: 400 900; font-display: block; }
@font-face { font-family: 'Outfit'; src: url('fonts/Outfit-latin.woff2') format('woff2'); font-weight: 100 900; font-display: block; }
html, body { margin: 0; background: transparent; }
.root { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: 'Outfit', system-ui, sans-serif; color: #fff;
        --ink-rgb: 20, 10, 46; --gold: #f7c65b; }
/* The bottom third: clear at its top edge, the ink deepening to the frame's foot. */
.band { position: absolute; left: 0; right: 0; top: 720px; bottom: 0;
        background: linear-gradient(180deg, rgba(var(--ink-rgb), 0) 0%, rgba(var(--ink-rgb), 0.78) 34%, rgba(var(--ink-rgb), 0.92) 100%); }
/* Anchored at the foot, so a two-line title grows upward and never off the frame. */
.row { position: absolute; left: 120px; bottom: 70px; display: flex; align-items: flex-end; gap: 40px; }
.num { font-family: 'Cinzel', serif; font-weight: 700; font-size: 168px; line-height: 0.86; color: transparent; -webkit-text-stroke: 2px var(--gold); }
.col { display: flex; flex-direction: column; gap: 12px; padding-bottom: 6px; }
.eyebrow { margin: 0; font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 24px; letter-spacing: 0.34em; color: var(--gold); }
.title { margin: 0; max-width: 1340px; font-family: 'Cinzel', serif; font-weight: 600; font-size: 64px; line-height: 1.06; letter-spacing: 0.02em; color: #ffffff;
         text-shadow: 0 2px 18px rgba(var(--ink-rgb), 0.6); }
.rule { width: 100%; min-width: 520px; height: 2px; transform-origin: left center; background: linear-gradient(90deg, var(--gold), transparent); }
</style>
</head>
<body>
<div id="g" class="root">
  <div id="band" class="band" aria-hidden="true"></div>
  <div class="row">
    <span id="num" class="num" aria-hidden="true"></span>
    <div class="col">
      <p id="eyebrow" class="eyebrow"></p>
      <h2 id="title" class="title"></h2>
      <div id="rule" class="rule" aria-hidden="true"></div>
    </div>
  </div>
</div>
<script src="runtime.js"></script>
<script>
(() => {
    'use strict';
    const g = window.GRAPHIC || {};
    const f = g.fields || {};
    const colors = g.colors || {};
    const el = id => document.getElementById(id);
    const hex = c => /^#[0-9a-fA-F]{6}$/.test(c || '');
    const rgb = c => { const n = parseInt(c.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };

    const root = el('g');
    if (hex(colors.background)) root.style.setProperty('--ink-rgb', rgb(colors.background).join(', '));
    if (hex(colors.accent)) root.style.setProperty('--gold', colors.accent);

    // "2" becomes the numeral II and the word TWO, as the design letters them; past twelve, the digits.
    const n = Math.max(1, Math.round(Number(f.number) || 1));
    const ROMAN = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII'];
    const WORDS = ['ONE', 'TWO', 'THREE', 'FOUR', 'FIVE', 'SIX', 'SEVEN', 'EIGHT', 'NINE', 'TEN', 'ELEVEN', 'TWELVE'];
    el('num').textContent = n <= 12 ? ROMAN[n - 1] : String(n);
    el('eyebrow').textContent = `CHAPTER ${n <= 12 ? WORDS[n - 1] : n}`;
    el('title').textContent = f.title || '';

    // In / hold / out: the band rises out of the frame's foot, the numeral slides in as its letter-spacing
    // settles, the chapter line and title rise, the rule draws out; a half-second fade out.
    const R = window.graphicRuntime;
    R.animate(el('band'), { inMs: 700, outMs: 500, enter: [
        { at: 0, opacity: 0, transform: 'translateY(80px)' }, { at: 1, opacity: 1, transform: 'translateY(0)' },
    ], exit: [{ at: 1, opacity: 0, transform: 'translateY(0)' }] });
    R.animate(el('num'), { delay: 150, inMs: 980, outMs: 500, enter: [
        { at: 0, opacity: 0, transform: 'translateX(-50px)', letterSpacing: '0.3em' },
        { at: 1, opacity: 1, transform: 'translateX(0)', letterSpacing: '0.02em' },
    ], exit: [{ at: 1, opacity: 0, transform: 'translateX(0)', letterSpacing: '0.02em' }] });
    const rise = (id, delay) => R.animate(el(id), { delay, inMs: 900, outMs: 500, enter: [
        { at: 0, opacity: 0, transform: 'translateY(22px)', filter: 'blur(8px)' },
        { at: 1, opacity: 1, transform: 'translateY(0)', filter: 'blur(0px)' },
    ], exit: [{ at: 1, opacity: 0, transform: 'translateY(0)', filter: 'blur(4px)' }] });
    rise('eyebrow', 350);
    rise('title', 500);
    R.animate(el('rule'), { delay: 700, inMs: 840, outMs: 500, enter: [
        { at: 0, opacity: 1, transform: 'scaleX(0)' }, { at: 1, opacity: 1, transform: 'scaleX(1)' },
    ], exit: [{ at: 1, opacity: 0, transform: 'scaleX(1)' }] });

    window.seek(0);
})();
</script>
</body>
</html>
