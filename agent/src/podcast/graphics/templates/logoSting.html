<!doctype html>
<!-- The logo sting (docs/specs/021-motion-graphics.md, M2), rebuilt from the design reference
     (docs/specs/021-motion-graphics/LogoSting.dc.html): the logo blooms out of a blur on the starry sky,
     a star flare ignites at its heart, gold rings burst, a light sweeps across the oval, and the site
     line rises under it. Same markup, colours and keyframes, with the review loop replaced by the
     in / hold / out timing in runtime.js. Fields: none; the logo comes from GRAPHIC.logo. Full screen:
     the sky is painted in the Studio's colours (the glow pair derived as thumbnailCanvas applyPalette). -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Logo sting</title>
<style>
@font-face { font-family: 'Outfit'; src: url('fonts/Outfit-latin.woff2') format('woff2'); font-weight: 100 900; font-display: block; }
html, body { margin: 0; background: transparent; }
.root { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: 'Outfit', system-ui, sans-serif; color: #fff;
        --gold: #f7c65b; --pale: #fde68a; }
.sky { position: absolute; inset: 0;
       background-image: radial-gradient(2px 2px at 11% 19%, rgba(255,255,255,.8), transparent),
           radial-gradient(1.5px 1.5px at 23% 77%, rgba(255,255,255,.6), transparent),
           radial-gradient(2px 2px at 36% 8%, rgba(255,255,255,.6), transparent),
           radial-gradient(1.5px 1.5px at 67% 88%, rgba(255,255,255,.5), transparent),
           radial-gradient(2px 2px at 79% 14%, rgba(255,255,255,.7), transparent),
           radial-gradient(1.5px 1.5px at 90% 59%, rgba(255,255,255,.6), transparent),
           radial-gradient(circle at 50% 44%, var(--glow0) 0%, var(--glow1) 30%, var(--ink) 60%, var(--deep) 100%); }
.ring { position: absolute; left: 610px; top: 150px; width: 700px; height: 600px; border-radius: 50%; box-sizing: border-box; }
.r1 { border: 2px solid rgba(var(--gold-rgb), 0.7); }
.r2 { border: 1px solid rgba(var(--pale-rgb), 0.5); }
.logo { position: absolute; left: 580px; top: 180px; width: 760px; height: 542px; }
.logo img { display: block; width: 760px; height: 542px; }
.sweepBox { position: absolute; inset: 6px; border-radius: 50%; overflow: hidden; mix-blend-mode: screen; }
.sweep { position: absolute; top: -10%; left: 0; width: 34%; height: 120%;
         background: linear-gradient(90deg, rgba(255,240,200,0), rgba(255,240,200,0.55) 50%, rgba(255,240,200,0)); }
.flareAt { position: absolute; left: 960px; top: 428px; width: 0; height: 0; }
.flare { position: absolute; left: 0; top: 0; width: 0; height: 0; mix-blend-mode: screen; }
.flare i { position: absolute; display: block; }
.flare .core { left: -90px; top: -90px; width: 180px; height: 180px; border-radius: 50%;
               background: radial-gradient(circle, #fff 0, #fff 9%, rgba(255,255,255,.55) 22%, rgba(196,181,253,.25) 48%, rgba(196,181,253,0) 70%); }
.flare .h { left: -520px; top: -2px; width: 1040px; height: 4px; background: linear-gradient(90deg, rgba(255,255,255,0), #fff 50%, rgba(255,255,255,0)); }
.flare .v { left: -2px; top: -320px; width: 4px; height: 640px; background: linear-gradient(180deg, rgba(255,255,255,0), #fff 50%, rgba(255,255,255,0)); }
.url { position: absolute; left: 0; right: 0; top: 800px; margin: 0; text-align: center;
       font-weight: 500; font-size: 30px; letter-spacing: 0.28em; color: var(--gold); }
</style>
</head>
<body>
<div id="g" class="root">
  <div class="sky" aria-hidden="true"></div>
  <div id="ring1" class="ring r1" aria-hidden="true"></div>
  <div id="ring2" class="ring r2" aria-hidden="true"></div>
  <div id="logo" class="logo">
    <img id="logoImg" alt="">
    <div class="sweepBox" aria-hidden="true"><div id="sweep" class="sweep"></div></div>
  </div>
  <div class="flareAt" aria-hidden="true"><div id="flare" class="flare"><i class="core"></i><i class="h"></i><i class="v"></i></div></div>
  <p id="url" class="url"></p>
</div>
<script src="runtime.js"></script>
<script>
(() => {
    'use strict';
    const g = window.GRAPHIC || {};
    const colors = g.colors || {};
    const hex = c => /^#[0-9a-fA-F]{6}$/.test(c || '');
    const rgbOf = c => { const n = parseInt(c.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
    const lighten = (c, a) => '#' + rgbOf(c).map(v => Math.round(v + (255 - v) * a).toString(16).padStart(2, '0')).join('');
    const darken = (c, a) => '#' + rgbOf(c).map(v => Math.round(v * (1 - a)).toString(16).padStart(2, '0')).join('');

    const root = document.getElementById('g');
    const ink = hex(colors.background) ? colors.background : '#140a2e';
    const gold = hex(colors.accent) ? colors.accent : '#f7c65b';
    const glow = ink === '#140a2e' ? ['#4a2f9c', '#23145a'] : [lighten(ink, 0.25), lighten(ink, 0.08)];
    root.style.setProperty('--ink', ink);
    root.style.setProperty('--deep', darken(ink, 0.45));
    root.style.setProperty('--glow0', glow[0]);
    root.style.setProperty('--glow1', glow[1]);
    root.style.setProperty('--gold', gold);
    root.style.setProperty('--gold-rgb', rgbOf(gold).join(', '));
    root.style.setProperty('--pale', lighten(gold, 0.45));
    root.style.setProperty('--pale-rgb', rgbOf(lighten(gold, 0.45)).join(', '));
    if (g.logo) document.getElementById('logoImg').src = g.logo;
    document.getElementById('url').textContent = 'SOULWISDOMCOLLECTIVE.COM';

    // The design's 6 s cycle as in / hold / out: the logo blooms over ~960 ms, the flare ignites and the
    // rings burst inside the first 2.8 s, the sweep crosses once, and everything settles for the hold.
    const R = window.graphicRuntime;
    const el = id => document.getElementById(id);
    R.animate(el('logo'), { inMs: 960, outMs: 500, enter: [
        { at: 0, opacity: 0, transform: 'scale(0.86)', filter: 'blur(14px)' },
        { at: 1, opacity: 1, transform: 'scale(1)', filter: 'blur(0px)' },
    ], exit: [{ at: 1, opacity: 0, transform: 'scale(1.04)', filter: 'blur(6px)' }] });
    // The rings and the sweep live inside the in part (outMs 0): their `at` is of inMs.
    R.animate(el('ring1'), { inMs: 2760, outMs: 0, enter: [
        { at: 0, opacity: 0, transform: 'scale(0.55)', easing: 'cubic-bezier(.16,1,.3,1)' },
        { at: 0.22, opacity: 0.9, transform: 'scale(0.9)', easing: 'cubic-bezier(.16,1,.3,1)' },
        { at: 1, opacity: 0, transform: 'scale(1.55)' },
    ], exit: [] });
    R.animate(el('ring2'), { delay: 250, inMs: 2760, outMs: 0, enter: [
        { at: 0, opacity: 0, transform: 'scale(0.55)', easing: 'cubic-bezier(.16,1,.3,1)' },
        { at: 0.22, opacity: 0.9, transform: 'scale(0.9)', easing: 'cubic-bezier(.16,1,.3,1)' },
        { at: 1, opacity: 0, transform: 'scale(1.55)' },
    ], exit: [] });
    R.animate(el('sweep'), { inMs: 2760, outMs: 0, enter: [
        { at: 0, transform: 'translateX(-130%) skewX(-18deg)', easing: 'cubic-bezier(.45,0,.2,1)' },
        { at: 0.52, transform: 'translateX(-130%) skewX(-18deg)', easing: 'cubic-bezier(.45,0,.2,1)' },
        { at: 1, transform: 'translateX(130%) skewX(-18deg)' },
    ], exit: [] });
    R.animate(el('flare'), { inMs: 1800, outMs: 400, enter: [
        { at: 0, opacity: 0, transform: 'scale(0.2) rotate(-40deg)' },
        { at: 0.4, opacity: 0, transform: 'scale(0.2) rotate(-40deg)' },
        { at: 0.67, opacity: 1, transform: 'scale(1.25) rotate(3deg)' },
        { at: 1, opacity: 0.85, transform: 'scale(0.8) rotate(0deg)' },
    ], exit: [{ at: 1, opacity: 0, transform: 'scale(0.4) rotate(0deg)' }] });
    R.animate(el('url'), { delay: 800, inMs: 960, outMs: 400, enter: [
        { at: 0, opacity: 0, transform: 'translateY(20px)' },
        { at: 1, opacity: 1, transform: 'translateY(0)' },
    ], exit: [{ at: 1, opacity: 0, transform: 'translateY(0)' }] });

    window.seek(0);
})();
</script>
</body>
</html>
