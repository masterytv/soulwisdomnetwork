<!doctype html>
<!-- The episode title card (docs/specs/021-motion-graphics.md, item M2), rebuilt from the design reference
     (docs/specs/021-motion-graphics/Main.dc.html): the star flare blooms over the night sky, the horizon
     arcs rise, the eyebrow, the title in Cinzel, the drawn rule and "with [Guest]" follow. Same markup,
     colours, type and keyframes, with the review loop replaced by the in / hold / out timing in runtime.js.
     Fields: title, guest ("with [Guest]" hidden when empty; `show` names the eyebrow when given).
     Full screen: the sky is painted, nothing shows through. Fonts come from local files only. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Episode title card</title>
<style>
@font-face { font-family: 'Cinzel'; src: url('fonts/Cinzel-latin.woff2') format('woff2'); font-weight: 400 900; font-display: block; }
@font-face { font-family: 'Outfit'; src: url('fonts/Outfit-latin.woff2') format('woff2'); font-weight: 100 900; font-display: block; }
@font-face { font-family: 'EB Garamond'; src: url('fonts/EBGaramond-Italic-latin.woff2') format('woff2'); font-weight: 400 800; font-style: italic; font-display: block; }
html, body { margin: 0; background: transparent; }
.root { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: 'Outfit', system-ui, sans-serif; color: #fff;
        --gold: #f7c65b; --lavender: #ddd0ff; }
.sky { position: absolute; inset: 0; background-color: var(--ink);
       background-image:
           radial-gradient(2px 2px at 8% 22%, rgba(255,255,255,.8), transparent), radial-gradient(1.5px 1.5px at 19% 71%, rgba(255,255,255,.6), transparent),
           radial-gradient(2px 2px at 31% 12%, rgba(255,255,255,.7), transparent), radial-gradient(1.5px 1.5px at 44% 84%, rgba(255,255,255,.5), transparent),
           radial-gradient(2px 2px at 63% 9%, rgba(255,255,255,.7), transparent), radial-gradient(1.5px 1.5px at 72% 64%, rgba(255,255,255,.6), transparent),
           radial-gradient(2px 2px at 86% 28%, rgba(255,255,255,.8), transparent), radial-gradient(1.5px 1.5px at 93% 78%, rgba(255,255,255,.5), transparent),
           radial-gradient(1.5px 1.5px at 55% 47%, rgba(255,255,255,.4), transparent),
           radial-gradient(ellipse 70% 62% at 50% 34%, var(--glow-a) 0%, var(--glow-b) 38%, var(--ink) 72%, var(--deep) 100%); }
.arc1 { position: absolute; left: -360px; top: 840px; width: 2640px; height: 900px; border-radius: 50%; border-top: 2px solid rgba(247,198,91,0.45); border-top-color: var(--gold-45); }
.arc2 { position: absolute; left: -200px; top: 880px; width: 2320px; height: 800px; border-radius: 50%; border-top: 1px solid rgba(247,198,91,0.22); border-top-color: var(--gold-22); }
.flare { position: absolute; left: 960px; top: 290px; width: 0; height: 0; }
.flare i { position: absolute; display: block; }
.flare .core { left: -70px; top: -70px; width: 140px; height: 140px; border-radius: 50%; background: radial-gradient(circle, #fff 0, #fff 10%, rgba(255,255,255,.6) 22%, rgba(196,181,253,.22) 48%, rgba(196,181,253,0) 70%); }
.flare .h { left: -340px; top: -2px; width: 680px; height: 4px; background: linear-gradient(90deg, rgba(255,255,255,0), #fff 50%, rgba(255,255,255,0)); }
.flare .v { left: -2px; top: -250px; width: 4px; height: 500px; background: linear-gradient(180deg, rgba(255,255,255,0), #fff 50%, rgba(255,255,255,0)); }
.flare .d1, .flare .d2 { left: -110px; top: -1px; width: 220px; height: 2px; background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.85) 50%, rgba(255,255,255,0)); transform: rotate(45deg); }
.flare .d2 { transform: rotate(-45deg); }
.col { position: absolute; left: 0; right: 0; top: 440px; display: flex; flex-direction: column; align-items: center; gap: 30px; text-align: center; }
.eyebrow { margin: 0; font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 26px; letter-spacing: 0.34em; text-transform: uppercase; color: var(--gold); }
.title { margin: 0; max-width: 1560px; font-family: 'Cinzel', serif; font-weight: 600; font-size: 92px; line-height: 1.08; letter-spacing: 0.02em; color: #ffffff; }
.rule { width: 460px; height: 2px; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
.guest { margin: 0; font-family: 'EB Garamond', serif; font-style: italic; font-size: 48px; color: var(--lavender); }
</style>
</head>
<body>
<div id="g" class="root">
  <div id="sky" class="sky" aria-hidden="true"></div>
  <div id="arc1" class="arc1" aria-hidden="true"></div>
  <div id="arc2" class="arc2" aria-hidden="true"></div>
  <div id="flare" class="flare" aria-hidden="true"><i class="core"></i><i class="h"></i><i class="v"></i><i class="d1"></i><i class="d2"></i></div>
  <div class="col">
    <p id="eyebrow" class="eyebrow"></p>
    <h1 id="title" class="title"></h1>
    <div id="rule" class="rule" aria-hidden="true"></div>
    <p id="guest" class="guest"></p>
  </div>
</div>
<script src="runtime.js"></script>
<script>
(() => {
    'use strict';
    const g = window.GRAPHIC || {};
    const f = g.fields || {};
    const colors = g.colors || {};
    const el = id => document.getElementById(id);
    const hex = c => /^#[0-9a-fA-F]{6}$/.test(c || '');
    const rgb = c => { const n = parseInt(c.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
    const toHex = v => `#${v.map(x => Math.round(Math.min(255, Math.max(0, x))).toString(16).padStart(2, '0')).join('')}`;
    const lighten = (c, amount) => toHex(rgb(c).map(x => x + amount * 255));
    const darken = (c, by) => toHex(rgb(c).map(x => x * by));

    const root = el('g');
    const ink = hex(colors.background) ? colors.background : '#140a2e';
    const gold = hex(colors.accent) ? colors.accent : '#f7c65b';
    // The glow behind the star, as thumbnailCanvas applyPalette derives it; the design's exact night
    // tones for the house colours.
    const [glowA, glowB] = ink === '#140a2e' ? ['#3b2382', '#23145a'] : [lighten(ink, 0.25), lighten(ink, 0.08)];
    root.style.setProperty('--ink', ink);
    root.style.setProperty('--deep', ink === '#140a2e' ? '#0b0520' : darken(ink, 0.55));
    root.style.setProperty('--glow-a', glowA);
    root.style.setProperty('--glow-b', glowB);
    root.style.setProperty('--gold', gold);
    root.style.setProperty('--gold-45', `rgba(${rgb(gold).join(',')},0.45)`);
    root.style.setProperty('--gold-22', `rgba(${rgb(gold).join(',')},0.22)`);

    el('eyebrow').textContent = f.show || 'Soul Wisdom Collective';
    el('title').textContent = f.title || '';
    el('guest').textContent = f.guest ? `with ${f.guest}` : '';
    if (!f.guest) el('guest').style.display = 'none';

    // The design's 8 s cycle as in / hold / out: the arcs and flare first, then the eyebrow, title,
    // rule and guest rise 150–250 ms apart out of a blur; everything fades over the last half second.
    const R = window.graphicRuntime;
    const rise = (id, delay, dy) => R.animate(el(id), { delay, inMs: 1040, outMs: 500, enter: [
        { at: 0, opacity: 0, transform: `translateY(${dy}px)`, filter: 'blur(10px)' },
        { at: 1, opacity: 1, transform: 'translateY(0)', filter: 'blur(0px)' },
    ], exit: [{ at: 1, opacity: 0, transform: 'translateY(-10px)', filter: 'blur(6px)' }] });
    R.animate(el('arc1'), { inMs: 1600, outMs: 500, enter: [
        { at: 0, opacity: 0, transform: 'translateY(60px)' }, { at: 1, opacity: 1, transform: 'translateY(0)' },
    ], exit: [{ at: 1, opacity: 0, transform: 'translateY(0)' }] });
    R.animate(el('arc2'), { delay: 450, inMs: 1600, outMs: 500, enter: [
        { at: 0, opacity: 0, transform: 'translateY(60px)' }, { at: 1, opacity: 1, transform: 'translateY(0)' },
    ], exit: [{ at: 1, opacity: 0, transform: 'translateY(0)' }] });
    R.animate(el('flare'), { inMs: 1360, outMs: 500, enter: [
        { at: 0, opacity: 0, transform: 'scale(0.15) rotate(-35deg)' },
        { at: 0.53, opacity: 1, transform: 'scale(1.2) rotate(4deg)' },
        { at: 1, opacity: 1, transform: 'scale(1) rotate(0deg)' },
    ], exit: [{ at: 1, opacity: 0, transform: 'scale(0.5) rotate(0deg)' }] });
    rise('eyebrow', 250, 28);
    rise('title', 450, 28);
    R.animate(el('rule'), { delay: 950, inMs: 960, outMs: 500, enter: [
        { at: 0, opacity: 0, transform: 'scaleX(0)' }, { at: 1, opacity: 1, transform: 'scaleX(1)' },
    ], exit: [{ at: 1, opacity: 0, transform: 'scaleX(0)' }] });
    if (f.guest) rise('guest', 1150, 28);

    window.seek(0);
})();
</script>
</body>
</html>
