<!doctype html>
<!-- The episode title card (docs/specs/021-motion-graphics.md, item M2) as a banner over the bottom third of
     the picture (Tom's call after the first episode: a full-screen slide stopped the conversation). The
     house look of the design reference (docs/specs/021-motion-graphics/Main.dc.html) carried down to a
     band: the night ink rising from the frame's foot, the gold rule drawing out, the star flare, the
     eyebrow, the title in Cinzel and "with [Guest]", centred, with in / hold / out timing (runtime.js).
     Fields: title, guest ("with [Guest]" hidden when empty; `show` names the eyebrow when given).
     Transparent above the band, so the episode shows through. Fonts come from local files only. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Episode title banner</title>
<style>
@font-face { font-family: 'Cinzel'; src: url('fonts/Cinzel-latin.woff2') format('woff2'); font-weight: 400 900; font-display: block; }
@font-face { font-family: 'Outfit'; src: url('fonts/Outfit-latin.woff2') format('woff2'); font-weight: 100 900; font-display: block; }
@font-face { font-family: 'EB Garamond'; src: url('fonts/EBGaramond-Italic-latin.woff2') format('woff2'); font-weight: 400 800; font-style: italic; font-display: block; }
html, body { margin: 0; background: transparent; }
.root { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: 'Outfit', system-ui, sans-serif; color: #fff;
        --ink-rgb: 20, 10, 46; --gold: #f7c65b; --lavender: #ddd0ff; }
/* The bottom third: clear at its top edge, the ink deepening to the frame's foot. */
.band { position: absolute; left: 0; right: 0; top: 720px; bottom: 0;
        background: linear-gradient(180deg, rgba(var(--ink-rgb), 0) 0%, rgba(var(--ink-rgb), 0.78) 34%, rgba(var(--ink-rgb), 0.92) 100%); }
/* Anchored at the foot, so a two-line title grows upward and never off the frame. */
.col { position: absolute; left: 0; right: 0; bottom: 64px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
.head { display: flex; align-items: center; gap: 18px; }
.star { width: 30px; height: 30px; flex-shrink: 0; }
.star path { fill: var(--gold); }
.eyebrow { margin: 0; font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 24px; letter-spacing: 0.34em; text-transform: uppercase; color: var(--gold); }
.title { margin: 0; max-width: 1600px; font-family: 'Cinzel', serif; font-weight: 600; font-size: 66px; line-height: 1.08; letter-spacing: 0.02em; color: #ffffff;
         text-shadow: 0 2px 18px rgba(var(--ink-rgb), 0.6); }
.rule { width: 520px; height: 2px; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
.guest { margin: 0; font-family: 'EB Garamond', serif; font-style: italic; font-size: 40px; color: var(--lavender); }
</style>
</head>
<body>
<div id="g" class="root">
  <div id="band" class="band" aria-hidden="true"></div>
  <div class="col">
    <div class="head">
      <svg id="star" class="star" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 0C12.9 8 16 11.1 24 12C16 12.9 12.9 16 12 24C11.1 16 8 12.9 0 12C8 11.1 11.1 8 12 0Z"></path></svg>
      <p id="eyebrow" class="eyebrow"></p>
    </div>
    <h1 id="title" class="title"></h1>
    <div id="rule" class="rule" aria-hidden="true"></div>
    <p id="guest" class="guest"></p>
  </div>
</div>
<script src="runtime.js"></script>
<script>
(() => {
    'use strict';
    const g = window.GRAPHIC || {};
    const f = g.fields || {};
    const colors = g.colors || {};
    const el = id => document.getElementById(id);
    const hex = c => /^#[0-9a-fA-F]{6}$/.test(c || '');
    const rgb = c => { const n = parseInt(c.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };

    const root = el('g');
    if (hex(colors.background)) root.style.setProperty('--ink-rgb', rgb(colors.background).join(', '));
    if (hex(colors.accent)) root.style.setProperty('--gold', colors.accent);

    el('eyebrow').textContent = f.show || 'Soul Wisdom Collective';
    el('title').textContent = f.title || '';
    el('guest').textContent = f.guest ? `with ${f.guest}` : '';
    if (!f.guest) el('guest').style.display = 'none';

    // In / hold / out: the band rises out of the frame's foot, the star blooms, the eyebrow, title, rule
    // and guest rise 150–250 ms apart out of a blur; everything fades over the last half second.
    const R = window.graphicRuntime;
    const rise = (id, delay, dy) => R.animate(el(id), { delay, inMs: 900, outMs: 500, enter: [
        { at: 0, opacity: 0, transform: `translateY(${dy}px)`, filter: 'blur(8px)' },
        { at: 1, opacity: 1, transform: 'translateY(0)', filter: 'blur(0px)' },
    ], exit: [{ at: 1, opacity: 0, transform: 'translateY(0)', filter: 'blur(4px)' }] });
    R.animate(el('band'), { inMs: 700, outMs: 500, enter: [
        { at: 0, opacity: 0, transform: 'translateY(80px)' }, { at: 1, opacity: 1, transform: 'translateY(0)' },
    ], exit: [{ at: 1, opacity: 0, transform: 'translateY(0)' }] });
    R.animate(el('star'), { delay: 150, inMs: 1050, outMs: 500, enter: [
        { at: 0, opacity: 0, transform: 'scale(0) rotate(-180deg)' },
        { at: 0.67, opacity: 1, transform: 'scale(1.25) rotate(10deg)' },
        { at: 1, opacity: 1, transform: 'scale(1) rotate(0deg)' },
    ], exit: [{ at: 1, opacity: 0, transform: 'scale(0.4) rotate(90deg)' }] });
    rise('eyebrow', 250, 20);
    rise('title', 400, 24);
    R.animate(el('rule'), { delay: 650, inMs: 840, outMs: 500, enter: [
        { at: 0, opacity: 0, transform: 'scaleX(0)' }, { at: 1, opacity: 1, transform: 'scaleX(1)' },
    ], exit: [{ at: 1, opacity: 0, transform: 'scaleX(1)' }] });
    if (f.guest) rise('guest', 800, 20);

    window.seek(0);
})();
</script>
</body>
</html>
