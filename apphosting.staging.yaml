# The staging backend (soulwisdomnetwork-staging, built from the `staging` branch; its Environment name is "staging").
# App Hosting adds this to apphosting.yaml for that backend only: the site shows a STAGING bar and is not indexed.
env:
  - variable: NEXT_PUBLIC_SITE_ENV
    value: staging
    availability:
      - BUILD
      - RUNTIME
  # The weekly email sign-up posts to Project Profound's staging site here (lib/newsletter.ts). The two staging
  # sites share PP's live database, so a sign-up made here is real.
  - variable: NEXT_PUBLIC_NEWSLETTER_SIGNUP_URL
    value: https://staging.projectprofound.org/api/quiz-lead
    availability:
      - BUILD
      - RUNTIME
