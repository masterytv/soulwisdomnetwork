# Installs ffmpeg and ffprobe from a pinned static build on GitHub releases, instead of apt:
# the runners' apt mirror repeatedly stalled the old install step past its 15-minute limit, and
# a download from GitHub's own release storage takes seconds and cannot drift — the sha256 pins
# the exact file. To update ffmpeg, change the tag, the asset name and the hash together
# (https://github.com/BtbN/FFmpeg-Builds; the build is GPL, with libass, fontconfig and libx264).
# BtbN deletes dated autobuild releases after a couple of weeks, and a deleted one fails every
# workflow with a 404 here: move to the newest autobuild-YYYY-MM-DD-HH-MM release when that happens.
# The on-screen text fonts need no install either: they ship in agent/assets/fonts, which the
# render hands to libass as its fontsdir (lib/onScreen.ts).
name: Install ffmpeg
description: ffmpeg and ffprobe from a pinned static build, not apt

runs:
  using: composite
  steps:
    - name: Install ffmpeg
      shell: bash
      run: |
        build=ffmpeg-N-128718-gb2b543c079-linux64-gpl
        curl -fsSL --retry 4 --retry-delay 5 --retry-all-errors --max-time 120 -o /tmp/ffmpeg.tar.xz \
          "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-11-09-12-42/$build.tar.xz"
        echo "143adb601603057053bf52f157daf36728e716b86fae764952271cdb4b3d56bc  /tmp/ffmpeg.tar.xz" | sha256sum -c
        mkdir -p "$HOME/ffmpeg-static"
        tar -xJf /tmp/ffmpeg.tar.xz -C "$HOME/ffmpeg-static" --strip-components=2 "$build/bin/ffmpeg" "$build/bin/ffprobe"
        rm /tmp/ffmpeg.tar.xz
        echo "$HOME/ffmpeg-static" >> "$GITHUB_PATH"
        "$HOME/ffmpeg-static/ffmpeg" -version | head -1
