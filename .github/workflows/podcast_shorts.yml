# Spec 005 step 14: Shorts from the key quotes (agent/src/podcast/shorts.ts, docs/specs/013-shorts.md).
# mode "titles": Claude writes headlines and titles for the key quotes picked; "render": draws the shorts that changed;
# "upload": schedules the shorts approved at Checkpoint E on YouTube, one a day. Started from the
# show notes page, or by hand from the Actions tab with the episode ID. With debug_short (a short's number as the
# Studio lists it, or its id) and mode "render", it makes only that short, timing each step and printing ffmpeg's own
# detail into the log, and writes nothing to the episode: for finding out why a short will not render.

name: Podcast Shorts
# The episode ID in the run name ties each run to its episode on the Usage page (lib/server/usage.ts).
run-name: "Podcast Shorts (${{ inputs.mode }}) · ${{ inputs.episode_id }}"

on:
  workflow_dispatch:
    inputs:
      episode_id:
        description: 'Episode ID (the Drive file ID in the Podcast Studio URL)'
        required: true
      mode:
        description: 'titles, render or upload'
        required: true
        default: 'render'
      debug_short:
        description: 'Debug: make only this short (its number, e.g. 2), log every step, write nothing to the episode'
        required: false
        default: ''

# One run per episode at a time; a second request for the same episode waits.
concurrency:
  group: podcast-shorts-${{ inputs.episode_id }}${{ inputs.debug_short != '' && '-debug' || '' }}
  cancel-in-progress: false

# The jobs use their own keys; the GitHub token only needs to read this repository.
permissions:
  contents: read

jobs:
  shorts:
    runs-on: ubuntu-latest
    # A debug run stops after 20 minutes: each of its steps has its own, shorter limit.
    timeout-minutes: ${{ inputs.debug_short != '' && 20 || 60 }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Install ffmpeg
      if: inputs.mode == 'render'
      uses: ./.github/actions/ffmpeg

    - name: Make Shorts
      env:
        EPISODE_ID: ${{ inputs.episode_id }}
        SHORTS_MODE: ${{ inputs.mode }}
        SHORTS_DEBUG: ${{ inputs.debug_short }}
        PODCAST_SA_JSON: ${{ secrets.PODCAST_SA_JSON }}
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
        YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
        YOUTUBE_PLAYLIST_ID: ${{ vars.YOUTUBE_PLAYLIST_ID }}
        GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: npx tsx agent/src/podcast/shorts.ts

    # Only when the step above was cancelled or killed before it could record how it ended: marks the job
    # stopped, so the Studio offers to try again at once (agent/src/podcast/jobStopped.ts).
    # Never after a debug run, which leaves the episode as it was (and may run beside a real one).
    - name: Mark an unfinished job as stopped
      if: ${{ (failure() || cancelled()) && inputs.debug_short == '' }}
      env:
        EPISODE_ID: ${{ inputs.episode_id }}
        JOB_FIELD: shorts
        PODCAST_SA_JSON: ${{ secrets.PODCAST_SA_JSON }}
        RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
        GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: npx tsx agent/src/podcast/jobStopped.ts
