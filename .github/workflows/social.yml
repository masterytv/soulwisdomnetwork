# Social publishing (docs/specs/026-social-publishing.md; D-2026-11-23-swc-autopost in DECISIONS.md): every Short approved
# at Checkpoint E and scheduled on YouTube goes to Soul Wisdom's Instagram and Facebook through Upload-Post.
#   check: hourly. Plans what is missing, cancels the posts of a Short no longer scheduled or public on YouTube, moves a
#          Reel whose Short moved, reads back results, and hands over what waits (Post pressed, a failure to retry).
#   plan:  one episode's posts (or every episode's), handed over with their times. podcast_shorts.yml runs the same
#          after it schedules Shorts.
#   send:  one post (post_id), after Post on the Studio's Social page.
# Each post is handed to Upload-Post with its own time, so these runs starting late never make a post late.
# Runs from `main`, like the podcast jobs.

name: Social
run-name: "Social · ${{ github.event_name == 'schedule' && 'check' || inputs.mode }}${{ inputs.post_id && format(' · {0}', inputs.post_id) || '' }}${{ inputs.episode_id && format(' · {0}', inputs.episode_id) || '' }}"

on:
  schedule:
    - cron: '23 * * * *'    # hourly; GitHub often starts it late, which only delays the check, never a post
  workflow_dispatch:
    inputs:
      mode:
        description: 'check, plan or send'
        required: true
        default: 'check'
        type: choice
        options: [check, plan, send]
      episode_id:
        description: 'plan: this episode only (blank: every episode)'
        required: false
        default: ''
      post_id:
        description: 'send: the post to hand over'
        required: false
        default: ''

# One at a time, queued, so two runs never hand the same post over twice.
concurrency:
  group: social
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  social:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    # The Reel's cover is a still of the Short.
    - name: Install ffmpeg
      uses: ./.github/actions/ffmpeg

    - name: Run social publishing
      env:
        SOCIAL_MODE: ${{ github.event_name == 'schedule' && 'check' || inputs.mode }}
        EPISODE_ID: ${{ inputs.episode_id }}
        POST_ID: ${{ inputs.post_id }}
        SOCIAL_AUTOPOST: ${{ vars.SOCIAL_AUTOPOST }}
        SOCIAL_START: ${{ vars.SOCIAL_START }}
        UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
        UPLOAD_POST_PROFILE: ${{ vars.UPLOAD_POST_PROFILE }}
        FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
        PODCAST_SA_JSON: ${{ secrets.PODCAST_SA_JSON }}
        YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
        YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        YOUTUBE_PLAYLIST_ID: ${{ vars.YOUTUBE_PLAYLIST_ID }}
      run: npx tsx agent/src/social/run.ts
