# DISABLED: Video retrieval feature no longer in use.
# To re-enable, uncomment the schedule and workflow_dispatch triggers below.

name: Daily Content Harvest (DISABLED)

on:
  # schedule:
  #   # 6:00 AM ET is 11:00 AM UTC (Standard Time) or 10:00 AM UTC (Daylight Time).
  #   # Setting to 11:00 UTC as a base.
  #   - cron: '0 11 * * *'
  # workflow_dispatch: # Allows manual trigger from GitHub UI
  workflow_dispatch: # Keep manual trigger only for potential debugging
    inputs:
      confirm:
        description: 'Type "yes" to confirm you want to run the disabled harvest'
        required: true

jobs:
  harvest:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'yes'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Run Content Scout Agent
      env:
        YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      run: npx tsx agent/src/scout.ts
