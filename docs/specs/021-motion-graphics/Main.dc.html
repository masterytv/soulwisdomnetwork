<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Episode title card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&amp;family=EB+Garamond:ital,wght@1,400;1,500&amp;family=Outfit:wght@400;500;600;800;900&amp;display=swap">
<style>
body{margin:0}
.root{--cyc:8s;position:relative;overflow:hidden;font-family:'Outfit',system-ui,sans-serif;color:#fff;background:#140a2e}
.sky{background-color:#140a2e;background-image:radial-gradient(2px 2px at 8% 22%,rgba(255,255,255,.8),transparent),radial-gradient(1.5px 1.5px at 19% 71%,rgba(255,255,255,.6),transparent),radial-gradient(2px 2px at 31% 12%,rgba(255,255,255,.7),transparent),radial-gradient(1.5px 1.5px at 44% 84%,rgba(255,255,255,.5),transparent),radial-gradient(2px 2px at 63% 9%,rgba(255,255,255,.7),transparent),radial-gradient(1.5px 1.5px at 72% 64%,rgba(255,255,255,.6),transparent),radial-gradient(2px 2px at 86% 28%,rgba(255,255,255,.8),transparent),radial-gradient(1.5px 1.5px at 93% 78%,rgba(255,255,255,.5),transparent),radial-gradient(1.5px 1.5px at 55% 47%,rgba(255,255,255,.4),transparent),radial-gradient(ellipse 70% 62% at 50% 34%,#3b2382 0%,#23145a 38%,#140a2e 72%,#0b0520 100%)}
.flare{position:absolute;left:0;top:0;width:0;height:0}
.flare i{position:absolute;display:block}
.flare .core{left:-70px;top:-70px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,#fff 0,#fff 10%,rgba(255,255,255,.6) 22%,rgba(196,181,253,.22) 48%,rgba(196,181,253,0) 70%)}
.flare .h{left:-340px;top:-2px;width:680px;height:4px;background:linear-gradient(90deg,rgba(255,255,255,0),#fff 50%,rgba(255,255,255,0))}
.flare .v{left:-2px;top:-250px;width:4px;height:500px;background:linear-gradient(180deg,rgba(255,255,255,0),#fff 50%,rgba(255,255,255,0))}
.flare .d1,.flare .d2{left:-110px;top:-1px;width:220px;height:2px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.85) 50%,rgba(255,255,255,0));transform:rotate(45deg)}
.flare .d2{transform:rotate(-45deg)}
.a{animation-duration:var(--cyc);animation-iteration-count:infinite;animation-fill-mode:both;animation-timing-function:cubic-bezier(.22,1,.36,1)}
.rise{animation-name:rise}.bloom{animation-name:bloom}.draw{animation-name:draw}.arc{animation-name:arcIn}
.d1{animation-delay:.25s}.d2{animation-delay:.45s}.d3{animation-delay:.7s}.d4{animation-delay:.9s}
.still .a{animation:none!important}
@keyframes rise{0%{opacity:0;transform:translateY(28px);filter:blur(10px)}13%,84%{opacity:1;transform:none;filter:blur(0)}94%,100%{opacity:0;transform:translateY(-10px);filter:blur(6px)}}
@keyframes bloom{0%{opacity:0;transform:scale(.15) rotate(-35deg)}9%{opacity:1;transform:scale(1.2) rotate(4deg)}17%,84%{opacity:1;transform:scale(1) rotate(0)}94%,100%{opacity:0;transform:scale(.5)}}
@keyframes draw{0%,6%{opacity:0;transform:scaleX(0)}18%,84%{opacity:1;transform:scaleX(1)}94%,100%{opacity:0;transform:scaleX(0)}}
@keyframes arcIn{0%{opacity:0;transform:translateY(60px)}20%,84%{opacity:1;transform:none}96%,100%{opacity:0}}
</style>
</helmet>
<div class="{{cls}}" style="width: 1920px; height: 1080px">
  <div class="sky" style="position: absolute; inset: 0"></div>
  <div aria-hidden="true" class="a arc" style="position: absolute; left: -360px; top: 840px; width: 2640px; height: 900px; border-radius: 50%; border-top: 2px solid rgba(247, 198, 91, 0.45)"></div>
  <div aria-hidden="true" class="a arc d2" style="position: absolute; left: -200px; top: 880px; width: 2320px; height: 800px; border-radius: 50%; border-top: 1px solid rgba(247, 198, 91, 0.22)"></div>
  <div aria-hidden="true" style="position: absolute; left: 960px; top: 290px; width: 0; height: 0">
    <div class="flare a bloom"><i class="core"></i><i class="h"></i><i class="v"></i><i class="d1"></i><i class="d2"></i></div>
  </div>
  <div style="position: absolute; left: 0; right: 0; top: 440px; display: flex; flex-direction: column; align-items: center; gap: 30px; text-align: center">
    <p class="a rise d1" style="margin: 0; font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 26px; letter-spacing: 0.34em; text-transform: uppercase; color: #f7c65b">Soul Wisdom Collective · Episode [00]</p>
    <h1 class="a rise d2" style="margin: 0; max-width: 1560px; font-family: 'Cinzel', serif; font-weight: 600; font-size: 92px; line-height: 1.08; letter-spacing: 0.02em; color: #ffffff">Near-Death Experiences &amp; the Nature of Consciousness</h1>
    <div class="a draw d3" style="width: 460px; height: 2px; background: linear-gradient(90deg, rgba(247,198,91,0), #f7c65b, rgba(247,198,91,0))"></div>
    <p class="a rise d4" style="margin: 0; font-family: 'EB Garamond', serif; font-style: italic; font-size: 48px; color: #ddd0ff">with [Guest Name]</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"motion":{"editor":"enum","options":["Loop","Still"],"default":"Loop","section":"Motion"},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const still = (this.props.motion ?? 'Loop') === 'Still';
    return { cls: still ? 'root still' : 'root' };
  }
}
</script>
</body>
</html>
