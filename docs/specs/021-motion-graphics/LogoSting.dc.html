<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Logo sting</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&amp;family=Outfit:wght@400;500;600;800&amp;display=swap">
<style>
body{margin:0}
.root{--cyc:6s;position:relative;overflow:hidden;font-family:'Outfit',system-ui,sans-serif;color:#fff;background:#140a2e}
.sky{background-color:#140a2e;background-image:radial-gradient(2px 2px at 11% 19%,rgba(255,255,255,.8),transparent),radial-gradient(1.5px 1.5px at 23% 77%,rgba(255,255,255,.6),transparent),radial-gradient(2px 2px at 36% 8%,rgba(255,255,255,.6),transparent),radial-gradient(1.5px 1.5px at 67% 88%,rgba(255,255,255,.5),transparent),radial-gradient(2px 2px at 79% 14%,rgba(255,255,255,.7),transparent),radial-gradient(1.5px 1.5px at 90% 59%,rgba(255,255,255,.6),transparent),radial-gradient(circle at 50% 44%,#4a2f9c 0%,#23145a 30%,#140a2e 60%,#0b0520 100%)}
.flare{position:absolute;left:0;top:0;width:0;height:0;mix-blend-mode:screen}
.flare i{position:absolute;display:block}
.flare .core{left:-90px;top:-90px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,#fff 0,#fff 9%,rgba(255,255,255,.55) 22%,rgba(196,181,253,.25) 48%,rgba(196,181,253,0) 70%)}
.flare .h{left:-520px;top:-2px;width:1040px;height:4px;background:linear-gradient(90deg,rgba(255,255,255,0),#fff 50%,rgba(255,255,255,0))}
.flare .v{left:-2px;top:-320px;width:4px;height:640px;background:linear-gradient(180deg,rgba(255,255,255,0),#fff 50%,rgba(255,255,255,0))}
.a{animation-duration:var(--cyc);animation-iteration-count:infinite;animation-fill-mode:both;animation-timing-function:cubic-bezier(.22,1,.36,1)}
.logoIn{animation-name:logoIn}.ignite{animation-name:ignite}.ring{animation-name:ring;animation-timing-function:cubic-bezier(.16,1,.3,1)}.sweep{animation-name:sweep;animation-timing-function:cubic-bezier(.45,0,.2,1)}.rise{animation-name:rise}
.r2{animation-delay:.25s}.dl{animation-delay:.8s}
.still .a{animation:none!important}
.still .ring,.still .sweep{opacity:0}
@keyframes logoIn{0%{opacity:0;transform:scale(.86);filter:blur(14px)}16%,86%{opacity:1;transform:scale(1);filter:blur(0)}96%,100%{opacity:0;transform:scale(1.04);filter:blur(6px)}}
@keyframes ignite{0%,12%{opacity:0;transform:scale(.2) rotate(-40deg)}20%{opacity:1;transform:scale(1.25) rotate(3deg)}30%,84%{opacity:.85;transform:scale(.8) rotate(0)}94%,100%{opacity:0;transform:scale(.4)}}
@keyframes ring{0%,10%{opacity:0;transform:scale(.55)}16%{opacity:.9}46%,100%{opacity:0;transform:scale(1.55)}}
@keyframes sweep{0%,24%{transform:translateX(-130%) skewX(-18deg)}46%,100%{transform:translateX(130%) skewX(-18deg)}}
@keyframes rise{0%{opacity:0;transform:translateY(20px)}16%,84%{opacity:1;transform:none}94%,100%{opacity:0}}
</style>
</helmet>
<div class="{{cls}}" style="width: 1920px; height: 1080px">
  <div class="sky" style="position: absolute; inset: 0"></div>
  <div aria-hidden="true" class="a ring" style="position: absolute; left: 610px; top: 150px; width: 700px; height: 600px; border-radius: 50%; border: 2px solid rgba(247, 198, 91, 0.7); box-sizing: border-box"></div>
  <div aria-hidden="true" class="a ring r2" style="position: absolute; left: 610px; top: 150px; width: 700px; height: 600px; border-radius: 50%; border: 1px solid rgba(253, 230, 138, 0.5); box-sizing: border-box"></div>
  <div class="a logoIn" style="position: absolute; left: 580px; top: 180px; width: 760px; height: 542px">
    <img src="../../../public/logo-trimmed.png" alt="Soul Wisdom Collective: Awaken, Empower, Transform" style="display: block; width: 760px; height: 542px">
    <div aria-hidden="true" style="position: absolute; inset: 6px; border-radius: 50%; overflow: hidden; mix-blend-mode: screen">
      <div class="a sweep" style="position: absolute; top: -10%; left: 0; width: 34%; height: 120%; background: linear-gradient(90deg, rgba(255,240,200,0), rgba(255,240,200,0.55) 50%, rgba(255,240,200,0))"></div>
    </div>
  </div>
  <div aria-hidden="true" style="position: absolute; left: 960px; top: 428px; width: 0; height: 0">
    <div class="flare a ignite"><i class="core"></i><i class="h"></i><i class="v"></i></div>
  </div>
  <p class="a rise dl" style="position: absolute; left: 0; right: 0; top: 800px; margin: 0; text-align: center; font-family: 'Outfit', sans-serif; font-weight: 500; font-size: 30px; letter-spacing: 0.28em; color: #f7c65b">SOULWISDOMCOLLECTIVE.COM</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"motion":{"editor":"enum","options":["Loop","Still"],"default":"Loop","section":"Motion"},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const still = (this.props.motion ?? 'Loop') === 'Still';
    return { cls: still ? 'root still' : 'root' };
  }
}
</script>
</body>
</html>
