<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Highlight: split, quote right</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&amp;family=EB+Garamond:ital,wght@0,500;1,400;1,500&amp;family=Outfit:wght@400;500;600;800&amp;display=swap">
<style>
body{margin:0}
.root{--cyc:9s;position:relative;overflow:hidden;font-family:'Outfit',system-ui,sans-serif;color:#fff;background:#140a2e}
.sky{background-color:#140a2e;background-image:radial-gradient(2px 2px at 62% 14%,rgba(255,255,255,.7),transparent),radial-gradient(1.5px 1.5px at 78% 82%,rgba(255,255,255,.5),transparent),radial-gradient(2px 2px at 93% 30%,rgba(255,255,255,.7),transparent),radial-gradient(1.5px 1.5px at 55% 92%,rgba(255,255,255,.5),transparent),radial-gradient(ellipse 55% 70% at 74% 45%,#3b2382 0%,#23145a 40%,#140a2e 75%,#0b0520 100%)}
.a{animation-duration:var(--cyc);animation-iteration-count:infinite;animation-fill-mode:both;animation-timing-function:cubic-bezier(.65,0,.25,1)}
.reframe{animation-name:reframe}.frame{animation-name:frame}.say{animation-name:say;animation-timing-function:cubic-bezier(.22,1,.36,1)}
.t1{animation-delay:.15s}.t2{animation-delay:.3s}.t3{animation-delay:.5s}.t4{animation-delay:.7s}
.still .a{animation:none!important}
@keyframes reframe{0%,8%{transform:translateX(0);clip-path:inset(0px 0px 0px 0px round 0px)}20%,76%{transform:translateX(-410px);clip-path:inset(140px 540px 140px 520px round 20px)}88%,100%{transform:translateX(0);clip-path:inset(0px 0px 0px 0px round 0px)}}
@keyframes frame{0%,15%{opacity:0;transform:scale(1.04)}22%,74%{opacity:1;transform:none}80%,100%{opacity:0}}
@keyframes say{0%,18%{opacity:0;transform:translateY(30px);filter:blur(10px)}28%,73%{opacity:1;transform:none;filter:blur(0)}80%,100%{opacity:0;transform:translateY(-8px);filter:blur(6px)}}
</style>
</helmet>
<div class="{{cls}}" style="width: 1920px; height: 1080px">
  <div class="sky" style="position: absolute; inset: 0"></div>

  <div aria-hidden="true" class="a reframe" style="position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; transform: translateX(-410px); clip-path: inset(140px 540px 140px 520px round 20px); background: radial-gradient(ellipse 60% 70% at 50% 40%, #7a6655 0%, #4a3d33 45%, #221c18 100%)">
    <div style="position: absolute; left: 810px; top: 230px; width: 300px; height: 360px; border-radius: 50%; background: #1d1714; opacity: 0.55; filter: blur(30px)"></div>
    <div style="position: absolute; left: 630px; top: 560px; width: 660px; height: 620px; border-radius: 48% 48% 0 0; background: #1d1714; opacity: 0.55; filter: blur(34px)"></div>
    <p style="position: absolute; left: 0; right: 0; top: 180px; margin: 0; text-align: center; font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 22px; letter-spacing: 0.2em; color: rgba(255,255,255,0.7)">[SPEAKER FOOTAGE]</p>
  </div>
  <div aria-hidden="true" class="a frame" style="position: absolute; left: 110px; top: 140px; width: 860px; height: 800px; box-sizing: border-box; border-radius: 20px; border: 2px solid rgba(247, 198, 91, 0.8); box-shadow: 0 30px 80px rgba(0,0,0,0.45)"></div>

  <div style="position: absolute; left: 1070px; top: 250px; width: 740px; display: flex; flex-direction: column; gap: 10px">
    <span aria-hidden="true" class="a say" style="display: block; height: 120px; font-family: 'EB Garamond', serif; font-weight: 500; font-size: 240px; line-height: 0.9; color: #f7c65b">“</span>
    <blockquote style="margin: 0; display: flex; flex-direction: column; gap: 4px">
      <span class="a say t1" style="display: block; font-family: 'EB Garamond', serif; font-style: italic; font-size: 72px; line-height: 1.14; color: #ffffff">No one has to prove</span>
      <span class="a say t2" style="display: block; font-family: 'EB Garamond', serif; font-style: italic; font-size: 72px; line-height: 1.14; color: #ffffff">what happened</span>
      <span class="a say t3" style="display: block; font-family: 'EB Garamond', serif; font-style: italic; font-size: 72px; line-height: 1.14; color: #fde68a">to them.</span>
    </blockquote>
    <div class="a say t4" style="margin-top: 34px; display: flex; align-items: center; gap: 14px">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24"><path d="M12 0C12.9 8 16 11.1 24 12C16 12.9 12.9 16 12 24C11.1 16 8 12.9 0 12C8 11.1 11.1 8 12 0Z" fill="#f7c65b"></path></svg>
      <p style="margin: 0; font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 24px; letter-spacing: 0.22em; text-transform: uppercase; color: #f7c65b">[Speaker Name]</p>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"motion":{"editor":"enum","options":["Loop","Still"],"default":"Loop","section":"Motion"},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const still = (this.props.motion ?? 'Loop') === 'Still';
    return { cls: still ? 'root still' : 'root' };
  }
}
</script>
</body>
</html>
