<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Highlight: push to a side panel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@1,400;1,500&amp;family=Outfit:wght@400;500;600;800&amp;display=swap">
<style>
body{margin:0}
.root{--cyc:9s;position:relative;overflow:hidden;font-family:'Outfit',system-ui,sans-serif;color:#fff;background:#140a2e}
.panelsky{background-color:#140a2e;background-image:radial-gradient(2px 2px at 20% 14%,rgba(255,255,255,.7),transparent),radial-gradient(1.5px 1.5px at 74% 22%,rgba(255,255,255,.6),transparent),radial-gradient(2px 2px at 86% 78%,rgba(255,255,255,.6),transparent),radial-gradient(1.5px 1.5px at 30% 90%,rgba(255,255,255,.5),transparent),radial-gradient(ellipse 90% 60% at 30% 45%,#3b2382 0%,#23145a 45%,#140a2e 100%)}
.a{animation-duration:var(--cyc);animation-iteration-count:infinite;animation-fill-mode:both;animation-timing-function:cubic-bezier(.65,0,.25,1)}
.push{animation-name:push}.panel{animation-name:panel}.say{animation-name:say;animation-timing-function:cubic-bezier(.22,1,.36,1)}.draw{animation-name:draw;animation-timing-function:cubic-bezier(.22,1,.36,1)}
.t1{animation-delay:.2s}.t2{animation-delay:.4s}.t3{animation-delay:.6s}.t4{animation-delay:.8s}
.still .a{animation:none!important}
@keyframes push{0%,8%{transform:translateX(0)}20%,76%{transform:translateX(-560px)}88%,100%{transform:translateX(0)}}
@keyframes panel{0%,8%{transform:translateX(780px)}20%,76%{transform:translateX(0)}88%,100%{transform:translateX(780px)}}
@keyframes say{0%,19%{opacity:0;transform:translateX(30px);filter:blur(8px)}28%,73%{opacity:1;transform:none;filter:blur(0)}79%,100%{opacity:0}}
@keyframes draw{0%,22%{transform:scaleX(0)}32%,73%{transform:scaleX(1);opacity:1}79%,100%{opacity:0}}
</style>
</helmet>
<div class="{{cls}}" style="width: 1920px; height: 1080px">
  <div aria-hidden="true" class="a push" style="position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; transform: translateX(-560px); background: radial-gradient(ellipse 60% 70% at 50% 40%, #7a6655 0%, #4a3d33 45%, #221c18 100%)">
    <div style="position: absolute; left: 810px; top: 230px; width: 300px; height: 360px; border-radius: 50%; background: #1d1714; opacity: 0.55; filter: blur(30px)"></div>
    <div style="position: absolute; left: 630px; top: 560px; width: 660px; height: 620px; border-radius: 48% 48% 0 0; background: #1d1714; opacity: 0.55; filter: blur(34px)"></div>
    <p style="position: absolute; left: 0; right: 0; top: 120px; margin: 0; text-align: center; font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 22px; letter-spacing: 0.2em; color: rgba(255,255,255,0.7)">[SPEAKER FOOTAGE]</p>
  </div>

  <aside class="a panel" style="position: absolute; left: 1140px; top: 0; width: 780px; height: 1080px; transform: translateX(0)">
    <div class="panelsky" style="position: absolute; inset: 0"></div>
    <div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 3px; height: 1080px; background: #f7c65b; box-shadow: 0 0 30px 6px rgba(247, 198, 91, 0.45)"></div>
    <div style="position: absolute; left: 90px; right: 80px; top: 300px; display: flex; flex-direction: column; gap: 26px">
      <div class="a say t1" style="display: flex; align-items: center; gap: 12px">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24"><path d="M12 0C12.9 8 16 11.1 24 12C16 12.9 12.9 16 12 24C11.1 16 8 12.9 0 12C8 11.1 11.1 8 12 0Z" fill="#f7c65b"></path></svg>
        <p style="margin: 0; font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 22px; letter-spacing: 0.3em; color: #f7c65b">WORTH REPEATING</p>
      </div>
      <blockquote style="margin: 0; display: flex; flex-direction: column; gap: 4px">
        <span class="a say t2" style="display: block; font-family: 'EB Garamond', serif; font-style: italic; font-size: 92px; line-height: 1.08; color: #ffffff">Curiosity</span>
        <span class="a say t3" style="display: block; font-family: 'EB Garamond', serif; font-style: italic; font-size: 92px; line-height: 1.08; color: #fde68a">over certainty.</span>
      </blockquote>
      <div aria-hidden="true" class="a draw t3" style="width: 140px; height: 2px; transform-origin: left center; background: #f7c65b"></div>
      <p class="a say t4" style="margin: 0; font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 22px; letter-spacing: 0.24em; text-transform: uppercase; color: #ddd2ff">[Speaker Name]</p>
    </div>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"motion":{"editor":"enum","options":["Loop","Still"],"default":"Loop","section":"Motion"},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const still = (this.props.motion ?? 'Loop') === 'Still';
    return { cls: still ? 'root still' : 'root' };
  }
}
</script>
</body>
</html>
