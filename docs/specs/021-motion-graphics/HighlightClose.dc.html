<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Highlight: close the video</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@1,400;1,500&amp;family=Outfit:wght@400;500;600;800&amp;display=swap">
<style>
body{margin:0}
.root{--cyc:9s;position:relative;overflow:hidden;font-family:'Outfit',system-ui,sans-serif;color:#fff;background:#140a2e}
.sky{background-color:#140a2e;background-image:radial-gradient(2px 2px at 8% 22%,rgba(255,255,255,.8),transparent),radial-gradient(1.5px 1.5px at 19% 71%,rgba(255,255,255,.6),transparent),radial-gradient(2px 2px at 31% 12%,rgba(255,255,255,.7),transparent),radial-gradient(1.5px 1.5px at 44% 88%,rgba(255,255,255,.5),transparent),radial-gradient(2px 2px at 63% 9%,rgba(255,255,255,.7),transparent),radial-gradient(1.5px 1.5px at 72% 70%,rgba(255,255,255,.6),transparent),radial-gradient(2px 2px at 88% 28%,rgba(255,255,255,.8),transparent),radial-gradient(ellipse 70% 62% at 50% 42%,#3b2382 0%,#23145a 38%,#140a2e 72%,#0b0520 100%)}
.flare{position:absolute;left:0;top:0;width:0;height:0}
.flare i{position:absolute;display:block}
.flare .core{left:-70px;top:-70px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,#fff 0,#fff 10%,rgba(255,255,255,.6) 22%,rgba(196,181,253,.22) 48%,rgba(196,181,253,0) 70%)}
.flare .h{left:-420px;top:-2px;width:840px;height:4px;background:linear-gradient(90deg,rgba(255,255,255,0),#fff 50%,rgba(255,255,255,0))}
.flare .v{left:-2px;top:-260px;width:4px;height:520px;background:linear-gradient(180deg,rgba(255,255,255,0),#fff 50%,rgba(255,255,255,0))}
.a{animation-duration:var(--cyc);animation-iteration-count:infinite;animation-fill-mode:both;animation-timing-function:cubic-bezier(.65,0,.25,1)}
.iris{animation-name:iris}.ring{animation-name:ring}.burst{animation-name:burst;animation-timing-function:cubic-bezier(.22,1,.36,1)}.say{animation-name:say;animation-timing-function:cubic-bezier(.22,1,.36,1)}
.t1{animation-delay:.2s}.t2{animation-delay:.45s}.t3{animation-delay:.7s}
.still .a{animation:none!important}
.still .ring,.still .burst{opacity:0}
@keyframes iris{0%,7%{clip-path:ellipse(1150px 820px at 50% 42%)}20%,76%{clip-path:ellipse(0px 0px at 50% 42%)}89%,100%{clip-path:ellipse(1150px 820px at 50% 42%)}}
@keyframes ring{0%,6%{opacity:0;transform:scale(1)}8%{opacity:1;transform:scale(1)}20%{opacity:1;transform:scale(0)}21%,75%{opacity:0;transform:scale(0)}77%{opacity:1;transform:scale(0)}88%{opacity:1;transform:scale(1)}90%,100%{opacity:0;transform:scale(1)}}
@keyframes burst{0%,17%{opacity:0;transform:scale(.2) rotate(-40deg)}22%{opacity:1;transform:scale(1.3) rotate(4deg)}30%{opacity:.25;transform:scale(.7)}36%,100%{opacity:0;transform:scale(.5)}}
@keyframes say{0%,22%{opacity:0;transform:translateY(30px);filter:blur(10px)}32%,72%{opacity:1;transform:none;filter:blur(0)}78%,100%{opacity:0;filter:blur(6px)}}
</style>
</helmet>
<div class="{{cls}}" style="width: 1920px; height: 1080px">
  <div class="sky" style="position: absolute; inset: 0"></div>

  <div style="position: absolute; left: 0; right: 0; top: 270px; display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center">
    <svg class="a say" aria-hidden="true" width="40" height="40" viewBox="0 0 24 24"><path d="M12 0C12.9 8 16 11.1 24 12C16 12.9 12.9 16 12 24C11.1 16 8 12.9 0 12C8 11.1 11.1 8 12 0Z" fill="#f7c65b"></path></svg>
    <blockquote style="margin: 18px 0 0 0; display: flex; flex-direction: column; gap: 6px">
      <span class="a say t1" style="display: block; font-family: 'EB Garamond', serif; font-style: italic; font-size: 108px; line-height: 1.1; color: #ffffff">Nobody carries</span>
      <span class="a say t2" style="display: block; font-family: 'EB Garamond', serif; font-style: italic; font-size: 108px; line-height: 1.1; color: #fde68a">the profound alone.</span>
    </blockquote>
    <p class="a say t3" style="margin: 34px 0 0 0; font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 24px; letter-spacing: 0.28em; text-transform: uppercase; color: #f7c65b">[Speaker Name]</p>
  </div>

  <div aria-hidden="true" class="a iris" style="position: absolute; inset: 0; overflow: hidden; clip-path: ellipse(0px 0px at 50% 42%); background: radial-gradient(ellipse 60% 70% at 50% 40%, #7a6655 0%, #4a3d33 45%, #221c18 100%)">
    <div style="position: absolute; left: 810px; top: 230px; width: 300px; height: 360px; border-radius: 50%; background: #1d1714; opacity: 0.55; filter: blur(30px)"></div>
    <div style="position: absolute; left: 630px; top: 560px; width: 660px; height: 620px; border-radius: 48% 48% 0 0; background: #1d1714; opacity: 0.55; filter: blur(34px)"></div>
    <p style="position: absolute; left: 0; right: 0; top: 120px; margin: 0; text-align: center; font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 22px; letter-spacing: 0.2em; color: rgba(255,255,255,0.7)">[SPEAKER FOOTAGE]</p>
  </div>
  <div aria-hidden="true" class="a ring" style="position: absolute; left: -190px; top: -366px; width: 2300px; height: 1640px; box-sizing: border-box; border-radius: 50%; border: 3px solid #f7c65b; box-shadow: 0 0 40px rgba(247,198,91,0.5); transform-origin: 50% 50%"></div>
  <div aria-hidden="true" style="position: absolute; left: 960px; top: 454px; width: 0; height: 0">
    <div class="flare a burst"><i class="core"></i><i class="h"></i><i class="v"></i></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"motion":{"editor":"enum","options":["Loop","Still"],"default":"Loop","section":"Motion"},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const still = (this.props.motion ?? 'Loop') === 'Still';
    return { cls: still ? 'root still' : 'root' };
  }
}
</script>
</body>
</html>
