<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Highlight: words over the video</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&amp;family=Outfit:wght@400;500;600;800;900&amp;display=swap">
<style>
body{margin:0}
.root{--cyc:8s;position:relative;overflow:hidden;font-family:'Outfit',system-ui,sans-serif;color:#fff;background:#000}
.a{animation-duration:var(--cyc);animation-iteration-count:infinite;animation-fill-mode:both;animation-timing-function:cubic-bezier(.65,0,.25,1)}
.dim{animation-name:dim}.tint{animation-name:tint}.pop{animation-name:pop;animation-timing-function:cubic-bezier(.16,1,.3,1)}.slam{animation-name:slam;animation-timing-function:cubic-bezier(.16,1,.3,1)}
.w1{animation-delay:0s}.w2{animation-delay:.22s}.w3{animation-delay:.5s}.w4{animation-delay:.72s}.w5{animation-delay:1.05s}.w6{animation-delay:1.2s}
.still .a{animation:none!important}
@keyframes dim{0%,8%{filter:brightness(1) blur(0);transform:scale(1)}18%,76%{filter:brightness(.38) blur(6px);transform:scale(1.04)}88%,100%{filter:brightness(1) blur(0);transform:scale(1)}}
@keyframes tint{0%,8%{opacity:0}18%,76%{opacity:1}88%,100%{opacity:0}}
@keyframes pop{0%,14%{opacity:0;transform:translateY(40px) scale(1.15);filter:blur(10px)}22%,72%{opacity:1;transform:none;filter:blur(0)}80%,100%{opacity:0;transform:translateY(-12px);filter:blur(6px)}}
@keyframes slam{0%,14%{opacity:0;transform:scale(1.8);filter:blur(16px)}21%{opacity:1;transform:scale(.96);filter:blur(0)}25%,72%{opacity:1;transform:none;filter:blur(0)}80%,100%{opacity:0;transform:scale(1.05);filter:blur(6px)}}
</style>
</helmet>
<div class="{{cls}}" style="width: 1920px; height: 1080px">
  <div aria-hidden="true" class="a dim" style="position: absolute; inset: 0; overflow: hidden; filter: brightness(0.38) blur(6px); transform: scale(1.04); background: radial-gradient(ellipse 60% 70% at 50% 40%, #7a6655 0%, #4a3d33 45%, #221c18 100%)">
    <div style="position: absolute; left: 810px; top: 230px; width: 300px; height: 360px; border-radius: 50%; background: #1d1714; opacity: 0.55; filter: blur(30px)"></div>
    <div style="position: absolute; left: 630px; top: 560px; width: 660px; height: 620px; border-radius: 48% 48% 0 0; background: #1d1714; opacity: 0.55; filter: blur(34px)"></div>
    <p style="position: absolute; left: 0; right: 0; top: 120px; margin: 0; text-align: center; font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 22px; letter-spacing: 0.2em; color: rgba(255,255,255,0.7)">[SPEAKER FOOTAGE]</p>
  </div>
  <div aria-hidden="true" class="a tint" style="position: absolute; inset: 0; background: radial-gradient(ellipse 70% 60% at 50% 50%, rgba(42,21,82,0.35) 0%, rgba(20,10,46,0.75) 100%)"></div>

  <div style="position: absolute; left: 0; right: 0; top: 300px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center">
    <p style="margin: 0; display: flex; gap: 34px; align-items: baseline">
      <span class="a pop w1" style="display: inline-block; font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 124px; line-height: 1.05; text-transform: uppercase; color: #ffffff">Every</span>
      <span class="a pop w2" style="display: inline-block; font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 124px; line-height: 1.05; text-transform: uppercase; color: #ffffff">experience</span>
    </p>
    <p style="margin: 0; display: flex; gap: 34px; align-items: baseline">
      <span class="a pop w3" style="display: inline-block; font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 124px; line-height: 1.05; text-transform: uppercase; color: #ffffff">is</span>
      <span class="a slam w4" style="display: inline-block; font-family: 'Cinzel', serif; font-weight: 700; font-size: 176px; line-height: 1.05; color: #f7c65b; text-shadow: 0 0 50px rgba(247, 198, 91, 0.45)">welcome</span>
      <span class="a pop w5" style="display: inline-block; font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 124px; line-height: 1.05; text-transform: uppercase; color: #ffffff">here.</span>
    </p>
    <p class="a pop w6" style="margin: 40px 0 0 0; font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 24px; letter-spacing: 0.28em; text-transform: uppercase; color: #f7c65b">[Speaker Name]</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"motion":{"editor":"enum","options":["Loop","Still"],"default":"Loop","section":"Motion"},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const still = (this.props.motion ?? 'Loop') === 'Still';
    return { cls: still ? 'root still' : 'root' };
  }
}
</script>
</body>
</html>
