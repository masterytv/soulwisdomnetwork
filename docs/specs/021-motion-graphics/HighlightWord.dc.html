<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Highlight: stressed word</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&amp;family=EB+Garamond:ital,wght@1,400;1,500&amp;family=Outfit:wght@400;500;600;800&amp;display=swap">
<style>
body{margin:0}
.root{--cyc:9s;position:relative;overflow:hidden;font-family:'Outfit',system-ui,sans-serif;color:#fff;background:#140a2e}
.sky{background-color:#140a2e;background-image:radial-gradient(2px 2px at 8% 16%,rgba(255,255,255,.7),transparent),radial-gradient(1.5px 1.5px at 21% 84%,rgba(255,255,255,.5),transparent),radial-gradient(2px 2px at 41% 9%,rgba(255,255,255,.7),transparent),radial-gradient(1.5px 1.5px at 33% 61%,rgba(255,255,255,.4),transparent),radial-gradient(ellipse 50% 70% at 26% 48%,#3b2382 0%,#23145a 40%,#140a2e 75%,#0b0520 100%)}
.flare{position:absolute;left:0;top:0;width:0;height:0}
.flare i{position:absolute;display:block}
.flare .core{left:-50px;top:-50px;width:100px;height:100px;border-radius:50%;background:radial-gradient(circle,#fff 0,#fff 10%,rgba(255,255,255,.6) 22%,rgba(247,198,91,.25) 48%,rgba(247,198,91,0) 70%)}
.flare .h{left:-200px;top:-1.5px;width:400px;height:3px;background:linear-gradient(90deg,rgba(255,255,255,0),#fff 50%,rgba(255,255,255,0))}
.flare .v{left:-1.5px;top:-140px;width:3px;height:280px;background:linear-gradient(180deg,rgba(255,255,255,0),#fff 50%,rgba(255,255,255,0))}
.a{animation-duration:var(--cyc);animation-iteration-count:infinite;animation-fill-mode:both;animation-timing-function:cubic-bezier(.65,0,.25,1)}
.reframe{animation-name:reframe}.frame{animation-name:frame}.stress{animation-name:stress;animation-timing-function:cubic-bezier(.16,1,.3,1)}.say{animation-name:say;animation-timing-function:cubic-bezier(.22,1,.36,1)}.bloom{animation-name:bloom;animation-timing-function:cubic-bezier(.22,1,.36,1)}
.t1{animation-delay:.2s}.t2{animation-delay:.45s}.t3{animation-delay:.6s}
.still .a{animation:none!important}
@keyframes reframe{0%,8%{transform:translateX(0);clip-path:inset(0px 0px 0px 0px round 0px)}20%,76%{transform:translateX(410px);clip-path:inset(140px 520px 140px 540px round 20px)}88%,100%{transform:translateX(0);clip-path:inset(0px 0px 0px 0px round 0px)}}
@keyframes frame{0%,15%{opacity:0;transform:scale(1.04)}22%,74%{opacity:1;transform:none}80%,100%{opacity:0}}
@keyframes stress{0%,18%{opacity:0;letter-spacing:.55em;filter:blur(14px)}32%,73%{opacity:1;letter-spacing:.04em;filter:blur(0)}80%,100%{opacity:0;letter-spacing:.04em;filter:blur(8px)}}
@keyframes say{0%,20%{opacity:0;transform:translateY(20px)}30%,73%{opacity:1;transform:none}80%,100%{opacity:0}}
@keyframes bloom{0%,22%{opacity:0;transform:scale(.2) rotate(-30deg)}30%{opacity:1;transform:scale(1.2)}38%,72%{opacity:.9;transform:none}80%,100%{opacity:0;transform:scale(.4)}}
</style>
</helmet>
<div class="{{cls}}" style="width: 1920px; height: 1080px">
  <div class="sky" style="position: absolute; inset: 0"></div>

  <div aria-hidden="true" class="a reframe" style="position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; transform: translateX(410px); clip-path: inset(140px 520px 140px 540px round 20px); background: radial-gradient(ellipse 60% 70% at 50% 40%, #6e6a74 0%, #403b46 45%, #1b181f 100%)">
    <div style="position: absolute; left: 810px; top: 230px; width: 300px; height: 360px; border-radius: 50%; background: #151217; opacity: 0.55; filter: blur(30px)"></div>
    <div style="position: absolute; left: 630px; top: 560px; width: 660px; height: 620px; border-radius: 48% 48% 0 0; background: #151217; opacity: 0.55; filter: blur(34px)"></div>
    <p style="position: absolute; left: 0; right: 0; top: 180px; margin: 0; text-align: center; font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 22px; letter-spacing: 0.2em; color: rgba(255,255,255,0.7)">[SPEAKER FOOTAGE]</p>
  </div>
  <div aria-hidden="true" class="a frame" style="position: absolute; left: 950px; top: 140px; width: 860px; height: 800px; box-sizing: border-box; border-radius: 20px; border: 2px solid rgba(247, 198, 91, 0.8); box-shadow: 0 30px 80px rgba(0,0,0,0.45)"></div>

  <div style="position: absolute; left: 110px; top: 330px; width: 800px; display: flex; flex-direction: column; align-items: center; gap: 22px; text-align: center">
    <p class="a say" style="margin: 0; font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 24px; letter-spacing: 0.3em; text-transform: uppercase; color: #f7c65b">[Speaker Name]</p>
    <div style="position: relative">
      <p class="a stress t1" style="margin: 0; font-family: 'Cinzel', serif; font-weight: 700; font-size: 190px; line-height: 1; letter-spacing: 0.04em; color: #f7c65b; text-shadow: 0 0 60px rgba(247, 198, 91, 0.35)">PEACE</p>
      <div aria-hidden="true" style="position: absolute; right: -6px; top: 6px; width: 0; height: 0">
        <div class="flare a bloom t2"><i class="core"></i><i class="h"></i><i class="v"></i></div>
      </div>
    </div>
    <p class="a say t3" style="margin: 0; max-width: 640px; font-family: 'EB Garamond', serif; font-style: italic; font-size: 42px; line-height: 1.3; color: #ddd2ff">“…[the line the word came from]”</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"motion":{"editor":"enum","options":["Loop","Still"],"default":"Loop","section":"Motion"},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const still = (this.props.motion ?? 'Loop') === 'Still';
    return { cls: still ? 'root still' : 'root' };
  }
}
</script>
</body>
</html>
